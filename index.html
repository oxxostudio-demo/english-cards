<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 英文單字卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .word-card { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f0f0f0;
        }
        .word-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.05);
        }
        .loading-spinner { 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #3498db; 
            border-radius: 50%; 
            width: 20px; 
            height: 20px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 隱藏滾動條但保持功能 */
        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        /* Modal 動畫與層級修正 */
        #edit-modal.flex {
            display: flex !important;
        }
        .modal-content {
            animation: modalAppear 0.2s ease-out forwards;
        }
        @keyframes modalAppear {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <!-- 登入介面 -->
    <div id="login-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-4">
        <div class="max-w-md w-full text-center space-y-8">
            <div class="space-y-2">
                <i class="fa-solid fa-book-open text-6xl text-blue-600"></i>
                <h1 class="text-3xl font-bold text-gray-900">AI 英文單字卡</h1>
                <p class="text-gray-500">請登入以開始管理您的專屬單字庫</p>
            </div>
            <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 py-3 px-4 rounded-xl shadow-sm hover:bg-gray-50 transition-all font-medium text-gray-700">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-6 h-6" alt="Google">
                使用 Google 帳號登入
            </button>
        </div>
    </div>

    <!-- 編輯對話框 (Modal) -->
    <div id="edit-modal" class="fixed inset-0 bg-black/60 z-[100] hidden items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl modal-content">
            <h2 class="text-xl font-bold mb-4 text-gray-800">編輯單字內容</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-500 mb-1">英文單字</label>
                    <input type="text" id="edit-word-input" class="w-full p-3 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-500 mb-1">中文解釋</label>
                    <input type="text" id="edit-def-input" class="w-full p-3 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button id="cancel-edit-btn" class="flex-1 py-3 text-gray-500 font-medium hover:bg-gray-50 rounded-xl transition-all">取消</button>
                <button id="confirm-edit-btn" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 shadow-md shadow-blue-100 transition-all">儲存修改</button>
            </div>
        </div>
    </div>

    <!-- 主畫面 -->
    <div id="main-screen" class="hidden pb-20">
        <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-40">
            <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-brain text-blue-600 text-2xl"></i>
                    <span class="font-bold text-xl text-gray-800 tracking-tight">My Vocab AI</span>
                </div>
                <div class="flex items-center gap-6">
                    <span id="user-name" class="text-sm font-medium text-gray-600 hidden sm:inline"></span>
                    <button id="logout-btn" class="text-sm text-gray-400 hover:text-red-500 transition-colors">登出</button>
                </div>
            </div>
        </nav>

        <main class="max-w-4xl mx-auto px-6 py-10">
            <!-- 新增單字區塊 -->
            <section class="bg-white p-6 rounded-[1.5rem] shadow-sm mb-10 border border-gray-100">
                <h2 class="text-lg font-bold mb-4 text-gray-800">新增學習項目</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="word-input" placeholder="輸入英文單字" class="w-full p-3 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    <div class="flex gap-3">
                        <input type="text" id="def-input" placeholder="中文解釋" class="flex-1 p-3 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <button id="ai-assist-btn" title="AI 輔助填寫" class="w-12 bg-purple-50 text-purple-600 rounded-xl hover:bg-purple-100 transition-all flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-wand-sparkles text-lg" id="ai-icon"></i>
                            <div id="ai-loading" class="loading-spinner hidden"></div>
                        </button>
                    </div>
                </div>
                <div class="mt-4 flex gap-3">
                    <button id="save-word-btn" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 shadow-md shadow-blue-100 transition-all">儲存到字庫</button>
                    <button id="clear-input-btn" class="px-6 py-3 text-gray-400 font-medium hover:text-gray-600 transition-all">清除</button>
                </div>
            </section>

            <!-- 單字列表 -->
            <div id="word-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot, addDoc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBnjG3WdfIj_jZkyzX9ROFltoa5zss0HY4",
          authDomain: "test-firestore-71e16.firebaseapp.com",
          projectId: "test-firestore-71e16",
          storageBucket: "test-firestore-71e16.firebasestorage.app",
          messagingSenderId: "817781507456",
          appId: "1:817781507456:web:0b0ce00e69c9d777c8ed65"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const appId = 'my-vocab-app'; 

        let currentUser = null;
        let geminiApiKey = "";
        let currentEditId = null;

        const loginScreen = document.getElementById('login-screen');
        const mainScreen = document.getElementById('main-screen');
        const loginBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const wordInput = document.getElementById('word-input');
        const defInput = document.getElementById('def-input');
        const aiAssistBtn = document.getElementById('ai-assist-btn');
        const saveWordBtn = document.getElementById('save-word-btn');
        const clearBtn = document.getElementById('clear-input-btn');
        const wordListContainer = document.getElementById('word-list');
        
        const editModal = document.getElementById('edit-modal');
        const editWordInput = document.getElementById('edit-word-input');
        const editDefInput = document.getElementById('edit-def-input');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const confirmEditBtn = document.getElementById('confirm-edit-btn');

        loginBtn.onclick = async () => {
            try { await signInWithPopup(auth, provider); } 
            catch (error) { alert("登入失敗: " + error.message); }
        };

        logoutBtn.onclick = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                mainScreen.classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName;
                fetchApiKey();
                initWordListener();
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                mainScreen.classList.add('hidden');
                wordListContainer.innerHTML = '';
            }
        });

        async function fetchApiKey() {
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'api', 'gemini');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) { geminiApiKey = docSnap.data().key; }
            } catch (error) { console.error("Error fetching API key:", error); }
        }

        function initWordListener() {
            if (!currentUser) return;
            const cardsCol = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'cards');
            onSnapshot(cardsCol, (snapshot) => {
                wordListContainer.innerHTML = '';
                const cards = [];
                snapshot.forEach(doc => { 
                    const data = doc.data();
                    cards.push({ id: doc.id, ...data }); 
                });
                
                cards.sort((a, b) => {
                    const timeA = a.time?.seconds ? a.time.seconds * 1000 : (Number(a.time) || 0);
                    const timeB = b.time?.seconds ? b.time.seconds * 1000 : (Number(b.time) || 0);
                    return timeB - timeA;
                });
                
                cards.forEach(renderWordCard);
            }, (error) => console.error("Listener error:", error));
        }

        saveWordBtn.onclick = async () => {
            const word = wordInput.value.trim();
            const translate = defInput.value.trim();
            if (!word || !translate) return alert("請填寫單字與翻譯");
            try {
                const cardsCol = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'cards');
                await addDoc(cardsCol, { 
                    word, 
                    translate, 
                    time: serverTimestamp() 
                });
                wordInput.value = ''; defInput.value = '';
            } catch (error) { console.error(error); }
        };

        clearBtn.onclick = () => { wordInput.value = ''; defInput.value = ''; };

        // 修正：確保 Modal 顯示為 flex 並移除 hidden
        window.openEditModal = (id, word, translate) => {
            currentEditId = id;
            editWordInput.value = word;
            editDefInput.value = translate;
            editModal.classList.remove('hidden');
            editModal.classList.add('flex');
        };

        // 修正：關閉 Modal 時正確切換 Class
        cancelEditBtn.onclick = () => {
            editModal.classList.add('hidden');
            editModal.classList.remove('flex');
            currentEditId = null;
        };

        confirmEditBtn.onclick = async () => {
            if (!currentEditId || !currentUser) return;
            const newWord = editWordInput.value.trim();
            const newDef = editDefInput.value.trim();
            if (!newWord || !newDef) return alert("欄位不可為空");

            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'cards', currentEditId);
                await updateDoc(docRef, {
                    word: newWord,
                    translate: newDef
                });
                cancelEditBtn.onclick();
            } catch (error) {
                console.error("Update failed:", error);
                alert("儲存失敗");
            }
        };

        window.deleteWord = async (id) => {
            if (!confirm("確定要刪除這張單字卡嗎？")) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'cards', id));
        };

        aiAssistBtn.onclick = async () => {
            const word = wordInput.value.trim();
            if (!word || !geminiApiKey) return alert("請輸入單字或檢查 API 配置");
            setAILoading(true);
            try {
                const systemPrompt = `你是一個英文老師，請回傳 "${word}" 英文字「常用又簡短」的繁體中文意思，不需要過多的解釋或標點符號，如果有拼字錯誤，除了產生中文解釋，也用括號的方式表示 ( 可能拼錯字，應該是 ... )。`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
                });
                const data = await response.json();
                const aiResult = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                if (aiResult) defInput.value = aiResult;
            } catch (error) { console.error(error); } finally { setAILoading(false); }
        };

        function setAILoading(isLoading) {
            document.getElementById('ai-icon').classList.toggle('hidden', isLoading);
            document.getElementById('ai-loading').classList.toggle('hidden', !isLoading);
            aiAssistBtn.disabled = isLoading;
        }

        window.speak = (text) => {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        };

        function renderWordCard(data) {
            const card = document.createElement('div');
            card.className = "word-card bg-white p-6 rounded-[1.2rem] flex flex-col relative";
            const cambridgeUrl = `https://dictionary.cambridge.org/zht/%E8%A9%9E%E5%85%B8/%E8%8B%B1%E8%AA%9E-%E6%BC%A2%E8%AA%9E-%E7%B9%81%E9%AB%94/${encodeURIComponent(data.word)}`;
            let dateString = "---";
            if (data.time) {
                const dateObj = data.time.toDate ? data.time.toDate() : new Date(Number(data.time));
                dateString = `${dateObj.getFullYear()}/${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
            }
            const safeWord = data.word.replace(/'/g, "\\'");
            const safeTranslate = data.translate.replace(/'/g, "\\'");

            card.innerHTML = `
                <div class="absolute top-4 right-4 flex gap-3">
                    <button onclick="openEditModal('${data.id}', '${safeWord}', '${safeTranslate}')" class="text-gray-300 hover:text-blue-500 transition-colors">
                        <i class="fa-solid fa-pen text-xs"></i>
                    </button>
                    <button onclick="deleteWord('${data.id}')" class="text-gray-300 hover:text-red-400 transition-colors">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
                <div class="mb-2">
                    <h3 class="text-2xl font-bold text-[#3056D3] leading-tight cursor-pointer inline-block" onclick="speak('${safeWord}')">
                        ${data.word}
                    </h3>
                </div>
                <div class="mb-6">
                    <p class="text-lg font-medium text-gray-600">${data.translate}</p>
                </div>
                <div class="mt-auto pt-4 border-t border-gray-100 flex justify-between items-center">
                    <a href="${cambridgeUrl}" target="_blank" class="text-[#4A90E2] text-sm font-semibold hover:underline flex items-center gap-1">
                        劍橋辭典 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                    </a>
                    <span class="text-xs text-gray-400 font-medium tracking-wide">
                        ${dateString}
                    </span>
                </div>
            `;
            wordListContainer.appendChild(card);
        }
    </script>
</body>
</html>
